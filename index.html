<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Заметки на полях Markdown-документа: замечания привязаны к строкам, рецензия выгружается одним файлом. Текст остаётся в вашем браузере."
    />
    <title>Маргиналии</title>
    <meta name="theme-color" content="#201f1d" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <!-- На iOS этот значок имеет приоритет над иконками из манифеста. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Firebase раздаёт сайт по двум адресам, а браузерное хранилище привязано
      // к адресу: зайдя вчера по одному, а сегодня по другому, человек увидел бы
      // пустое приложение и решил, что рецензии пропали. Уводим на канонический
      // адрес до того, как приложение обратится к хранилищу.
      if (location.hostname === "marginalia-review.firebaseapp.com") {
        location.replace(
          "https://marginalia-review.web.app" + location.pathname + location.search + location.hash,
        );
      }
    </script>
    <link
      rel="stylesheet"
      href="/_ds/classical-d7409962-51c5-43a3-aa70-c4313bf63b66/styles.css"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <header class="app-header">
        <div class="brand" aria-label="Маргиналии">
          <span class="mi brand-mark" aria-hidden="true">menu_book</span>
          <span>Маргиналии</span>
        </div>

        <div class="document-controls">
          <label class="sr-only" for="document-select">Открытый документ</label>
          <select id="document-select" class="document-select" disabled>
            <option>Документ не открыт</option>
          </select>
          <button id="open-files" class="btn btn-secondary compact-btn" type="button">
            Открыть .md
          </button>
          <input
            id="file-input"
            class="sr-only"
            type="file"
            accept=".md,.markdown,text/markdown,text/plain"
            multiple
          />
          <button
            id="add-version"
            class="btn btn-secondary action-button"
            type="button"
            data-tooltip="Новая версия"
            aria-label="Загрузить новую версию этой статьи"
            disabled
          >
            <svg class="glyph" aria-hidden="true" width="15" height="15" viewBox="0 0 15 15" fill="none">
              <rect x="1.6" y="1.6" width="8" height="9.6" rx="1.4"></rect>
              <path d="M5.4 13.4h6.2a1.4 1.4 0 0 0 1.4-1.4V5.2"></path>
              <path d="M4.2 6.4h3.2M5.8 4.8v3.2"></path>
            </svg>
          </button>
          <button
            id="delete-document"
            class="btn btn-secondary action-button"
            type="button"
            data-tooltip="Удалить документ"
            aria-label="Удалить документ вместе с его рецензией"
            disabled
          >
            <svg class="glyph" aria-hidden="true" width="15" height="15" viewBox="0 0 15 15" fill="none">
              <path d="M2.4 3.9h10.2"></path>
              <path d="M6 3.9V2.6h3v1.3"></path>
              <path d="M3.7 3.9l.7 8a1.2 1.2 0 0 0 1.2 1.1h3.8a1.2 1.2 0 0 0 1.2-1.1l.7-8"></path>
              <path d="M6.2 6.4v4M8.8 6.4v4"></path>
            </svg>
          </button>
        </div>

        <div class="search-box" role="search">
          <label class="sr-only" for="search-input">Поиск по документу</label>
          <svg aria-hidden="true" width="14" height="14" viewBox="0 0 14 14" fill="none">
            <circle cx="6" cy="6" r="4.2"></circle>
            <line x1="9.2" y1="9.2" x2="12.5" y2="12.5"></line>
          </svg>
          <input id="search-input" type="search" placeholder="Поиск по документу" disabled />
          <span id="search-counter" class="search-counter" aria-live="polite">0 / 0</span>
          <button id="search-prev" class="icon-button" type="button" title="Предыдущее совпадение" disabled>
            <span aria-hidden="true">↑</span><span class="sr-only">Предыдущее совпадение</span>
          </button>
          <button id="search-next" class="icon-button" type="button" title="Следующее совпадение" disabled>
            <span aria-hidden="true">↓</span><span class="sr-only">Следующее совпадение</span>
          </button>
        </div>

        <div class="header-actions">
          <span id="review-count" class="review-count">0 замечаний</span>
          <span id="save-state" class="save-state" role="status" aria-live="polite" hidden></span>
          <button
            id="copy-review"
            class="btn btn-secondary action-button"
            type="button"
            data-tooltip="Скопировать"
            aria-label="Скопировать рецензию в буфер обмена"
            disabled
          >
            <span class="mi" aria-hidden="true">content_copy</span>
          </button>
          <button
            id="save-review"
            class="btn btn-secondary action-button"
            type="button"
            data-tooltip="Скачать"
            aria-label="Скачать рецензию в файл .md"
            disabled
          >
            <span class="mi" aria-hidden="true">download</span>
          </button>
          <button id="theme-toggle" class="btn btn-icon theme-toggle" type="button" title="Тёмная тема">
            <span aria-hidden="true">◐</span><span class="sr-only">Включить тёмную тему</span>
          </button>
        </div>
      </header>

      <main class="workspace">
        <aside id="review-pane" class="review-pane" aria-label="Рецензия">
          <div class="review-toolbar">
            <div id="filter-list" class="filter-list" aria-label="Фильтры замечаний"></div>
            <button
              id="add-general"
              class="btn btn-secondary add-general"
              type="button"
              data-tooltip="Общее замечание"
              aria-label="Общее замечание"
              disabled
            >
              <span class="mi" aria-hidden="true">add_comment</span>
            </button>
            <span class="sort-label">по порядку строк</span>
            <button
              id="open-review"
              class="btn btn-secondary action-button"
              type="button"
              data-tooltip="Открыть рецензию"
              aria-label="Открыть сохранённую рецензию из файла"
              disabled
            >
              <svg class="glyph" aria-hidden="true" width="15" height="15" viewBox="0 0 15 15" fill="none">
                <path d="M3 9.4v2.2a1.3 1.3 0 0 0 1.3 1.3h6.4a1.3 1.3 0 0 0 1.3-1.3V9.4"></path>
                <path d="M7.5 2.2v7.2"></path>
                <path d="M4.9 4.8L7.5 2.2l2.6 2.6"></path>
              </svg>
            </button>
            <input
              id="review-input"
              class="sr-only"
              type="file"
              accept=".md,.markdown,text/markdown,text/plain"
            />
            <button
              id="preview-review"
              class="btn btn-secondary preview-button"
              type="button"
              data-tooltip="Предпросмотр"
              aria-label="Предпросмотр"
              disabled
            >
              <span class="mi" aria-hidden="true">visibility</span>
            </button>
          </div>
          <p id="import-notice" class="import-notice" role="status" hidden></p>
          <div id="storage-notice" class="storage-notice" role="status" hidden>
            <p id="storage-notice-text"></p>
            <button id="install-app" class="btn btn-secondary compact-btn" type="button" hidden>
              Установить приложение
            </button>
          </div>
          <div id="review-list" class="review-list" aria-live="polite">
            <div class="empty-review">
              <p>Здесь появится рецензия.</p>
              <span>Выделите текст справа и выберите тип замечания.</span>
            </div>
          </div>
        </aside>

        <div
          class="pane-resizer"
          data-resize="review"
          role="separator"
          aria-orientation="vertical"
          aria-label="Ширина панели рецензии"
          aria-controls="review-pane"
          aria-valuemin="300"
          aria-valuemax="760"
          aria-valuenow="520"
          tabindex="0"
        ></div>

        <section id="document-pane" class="document-pane" aria-label="Исходный документ">
          <div id="document-empty" class="document-empty">
            <div class="empty-mark" aria-hidden="true">¶</div>
            <h1>Откройте Markdown-документ</h1>
            <p>Файл останется в этом браузере и не будет отправлен наружу.</p>
            <button id="open-files-empty" class="btn btn-primary" type="button">Выбрать .md</button>
          </div>
          <article id="document-body" class="document-body" hidden></article>
          <div id="quote-toolbar" class="quote-toolbar" hidden role="toolbar" aria-label="Создать замечание">
            <span class="quote-label">Цитировать</span>
            <button type="button" data-quote-type="Правка">Правка</button>
            <button type="button" data-quote-type="Вопрос">Вопрос</button>
            <button type="button" data-quote-type="Удалить">Удалить</button>
            <button type="button" data-quote-type="Переписать">Переписать</button>
          </div>
        </section>

        <div
          class="pane-resizer"
          data-resize="toc"
          role="separator"
          aria-orientation="vertical"
          aria-label="Ширина оглавления"
          aria-controls="toc-bar"
          aria-valuemin="160"
          aria-valuemax="460"
          aria-valuenow="248"
          tabindex="0"
        ></div>

        <nav id="toc-bar" class="toc-bar" aria-label="Оглавление документа">
          <span class="toc-label">Оглавление</span>
          <span class="toc-divider" aria-hidden="true"></span>
          <div id="toc-list" class="toc-list">
            <span class="toc-empty">Откройте документ</span>
          </div>
          <span id="document-meta" class="document-meta"></span>
        </nav>
      </main>

      <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

      <dialog id="preview-dialog" class="preview-dialog">
        <div class="dialog-heading">
          <h2>Markdown-рецензия</h2>
          <button id="close-preview" class="btn btn-icon" type="button" aria-label="Закрыть">×</button>
        </div>
        <pre id="preview-content" tabindex="0"></pre>
      </dialog>
    </div>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
